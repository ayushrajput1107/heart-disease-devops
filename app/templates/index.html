<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heart Disease Classifier</title>
<style>
  body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:24px}
  .card{max-width:560px;margin:auto;background:#fff;padding:24px;border-radius:10px;box-shadow:0 2px 8px #0002}
  h1{margin-top:0;font-size:22px;color:#b00020}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label{font-size:12px;color:#444;display:block}
  input{width:100%;padding:6px;box-sizing:border-box}
  button{margin-top:14px;padding:10px 16px;cursor:pointer;background:#b00020;color:#fff;border:0;border-radius:6px}
  #result{margin-top:16px;padding:12px;border-radius:6px;display:none;font-weight:bold}
  .bad{background:#fde7ea;color:#8a0016}.good{background:#e4f6e8;color:#14612a}
  small{color:#666;display:block;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <h1>Heart Disease Classifier</h1>
  <div class="grid" id="form"></div>
  <button onclick="predict()">Predict</button>
  <div id="result"></div>
  <small>Model accuracy on test data: {{ (metrics.accuracy * 100) | round(1) }}%.
  Educational project only &mdash; not medical advice.</small>
</div>
<script>
const fields = [
 ["age","Age (years)",54],["sex","Sex (1=male, 0=female)",1],
 ["cp","Chest pain type (0-3)",0],["trestbps","Resting BP (mm Hg)",130],
 ["chol","Cholesterol (mg/dl)",240],["fbs","Fasting sugar &gt;120 (1/0)",0],
 ["restecg","Resting ECG (0-2)",1],["thalach","Max heart rate",150],
 ["exang","Exercise angina (1/0)",0],["oldpeak","ST depression",1.0],
 ["slope","ST slope (0-2)",1],["ca","Major vessels (0-4)",0],
 ["thal","Thal (0-3)",2]];
document.getElementById('form').innerHTML = fields.map(f =>
  `<div><label>${f[1]}</label><input id="${f[0]}" type="number" step="any" value="${f[2]}"></div>`).join('');
async function predict(){
  const body = {};
  fields.forEach(f => body[f[0]] = document.getElementById(f[0]).value);
  const r = await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d = await r.json(), el = document.getElementById('result');
  el.style.display='block';
  if(!r.ok){ el.className='bad'; el.textContent = d.error; return; }
  el.className = d.prediction ? 'bad' : 'good';
  el.textContent = d.label + ' (probability ' + (d.probability*100).toFixed(1) + '%)';
}
</script>
</body>
</html>
